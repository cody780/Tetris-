<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GridFlow Debug – by ꜱᴀᴍᴍɪᴇ</title>
  <style>
    body {
      margin:0; padding:0; height:100vh; background:#000; overflow:hidden; touch-action:none; font-family:sans-serif; color:#eee;
    }
    #menu, #difficulty-screen {
      position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:20;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
    }
    .hidden { display:none !important; }

    button {
      width:80%; max-width:340px; padding:18px; margin:12px 0;
      font-size:22px; background:#222; border:3px solid #666; color:#eee; border-radius:12px;
    }
    button:active { background:#006699; }

    #game-container {
      height:100vh; display:flex; flex-direction:column;
    }

    #game-area {
      flex:1; background:#000; position:relative; pointer-events:none;
    }

    #game-board {
      width:60vw; max-width:380px; height:80vh; max-height:600px;
      background:#000; border:3px solid #444;
      image-rendering:pixelated;
    }

    #controller-area {
      height:45vh; background:#111; border-top:4px solid #444;
      display:flex; justify-content:space-around; align-items:center; padding:0 20px;
    }

    .ctrl-btn {
      width:110px; height:110px; min-width:100px; min-height:100px;
      background:#444; border:5px solid #888; border-radius:50%;
      color:white; font-size:40px; font-weight:bold;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 6px 16px rgba(0,0,0,0.7);
      touch-action:manipulation;
    }
    .ctrl-btn:active { background:#777; transform:scale(0.92); }
  </style>
</head>
<body>

  <div id="menu">
    <h1 style="font-size:80px; margin-bottom:20px; color:#0ff; text-shadow:0 0 30px #0ff;">GridFlow</h1>
    <p style="margin-bottom:40px;">by ꜱᴀᴍᴍɪᴇ</p>
    <button id="start">START GAME</button>
  </div>

  <div id="difficulty-screen" class="hidden">
    <h2 style="font-size:50px; color:#0ff; margin-bottom:40px;">Choose Difficulty</h2>
    <button id="easy">EASY</button>
    <button id="medium">MEDIUM</button>
    <button id="extreme">EXTREME</button>
  </div>

  <div id="game-container" class="hidden">
    <div id="game-area">
      <canvas id="game-board"></canvas>
    </div>
    <div id="controller-area">
      <div style="display:flex; gap:20px; flex-wrap:wrap; justify-content:center;">
        <div class="ctrl-btn">←</div>
        <div class="ctrl-btn">→</div>
        <div class="ctrl-btn">↓</div>
        <div class="ctrl-btn">↑</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:30px; align-items:center;">
        <div class="ctrl-btn">Z</div>
        <div class="ctrl-btn" style="width:140px; height:140px; font-size:60px;">▼</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game-board');
    const ctx = canvas.getContext('2d');

    let BLOCK = 0;

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      BLOCK = Math.max(34, Math.floor(w / 10));  // min 34px so lines visible

      canvas.width = w * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.scale(dpr, dpr);

      console.log(`Canvas ready: ${canvas.width}x${canvas.height}px, BLOCK = ${BLOCK}px`);
      drawDebug();
    }

    function drawDebug() {
      ctx.fillStyle = '#000022';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines - must be visible
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 10; i++) {
        ctx.beginPath();
        ctx.moveTo(i * BLOCK, 0);
        ctx.lineTo(i * BLOCK, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i <= 20; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * BLOCK);
        ctx.lineTo(canvas.width, i * BLOCK);
        ctx.stroke();
      }

      // Big cyan test block in center
      ctx.fillStyle = '#00FFFF';
      ctx.fillRect(3 * BLOCK, 8 * BLOCK, 4 * BLOCK, BLOCK);
      ctx.strokeStyle = '#008888';
      ctx.lineWidth = 3;
      ctx.strokeRect(3 * BLOCK, 8 * BLOCK, 4 * BLOCK, BLOCK);

      console.log("Debug draw called - should see grid + cyan bar");
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Start flow
    document.getElementById('start').onclick = () => {
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('difficulty-screen').classList.remove('hidden');
    };

    function startGame() {
      document.getElementById('difficulty-screen').classList.add('hidden');
      document.getElementById('game-container').classList.remove('hidden');
      resizeCanvas();          // re-apply after show
      drawDebug();             // force immediate draw
      setInterval(drawDebug, 2000); // keep drawing to confirm loop
      console.log("Game area should now be visible");
    }

    document.getElementById('easy').onclick = startGame;
    document.getElementById('medium').onclick = startGame;
    document.getElementById('extreme').onclick = startGame;

    // Controller sound test
    document.querySelectorAll('.ctrl-btn').forEach(btn => {
      btn.addEventListener('touchstart', e => {
        e.preventDefault();
        console.log("Button pressed");
        // add sound here later
      });
    });
  </script>
</body>
  </html>
