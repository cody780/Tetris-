<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GridFlow</title>
  <style>
    body {
      margin:0; height:100vh; background:#000; overflow:hidden; touch-action:none; font-family:sans-serif; color:#eee;
    }

    #start-screen, #difficulty {
      position:fixed; inset:0; z-index:100;
      background:#000d; display:flex; flex-direction:column; justify-content:center; align-items:center;
    }
    .hidden { display:none !important; }

    h1 { font-size: clamp(5rem, 20vw, 10rem); background:linear-gradient(90deg,#0ff,#f0f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    button {
      width:80%; max-width:340px; padding:20px; margin:12px 0;
      font-size:22px; background:#222; border:3px solid #555; color:#eee; border-radius:10px;
    }
    button:active { background:#006; transform:scale(0.96); }

    #game {
      height:100vh; display:flex; flex-direction:column;
    }

    #play-area {
      flex: 5.7; position: relative; background:#000; display: flex; justify-content:center; align-items:center; pointer-events:none;
    }

    #canvas {
      width: 62vw; max-width: 380px; height: 94%; max-height: 640px;
      background:#000; border: 3px solid #333; image-rendering: pixelated;
    }

    #next-preview {
      position: absolute; right: 12px; top: 12px; width: 90px; height: 90px;
      background: #0a0a1a; border: 2px solid #444; border-radius: 6px;
    }

    #pause-btn {
      position: absolute; top: 12px; left: 12px; width: 50px; height: 50px;
      background: rgba(255,180,0,0.85); border: 3px solid #ff0; border-radius: 50%;
      color: white; font-size: 1.9rem; display: flex; align-items: center; justify-content: center; z-index: 10;
    }

    #controller {
      flex: 4.3; background: #0a0a0a; border-top: 4px solid #333;
      display: flex; justify-content: space-between; align-items: center; padding: 0 25px 15px;
    }

    .btn {
      width: clamp(100px, 22vw, 140px); height: clamp(100px, 22vw, 140px);
      background: #3a3a3a; border: 5px solid #777; border-radius: 50%;
      color: white; font-size: clamp(2.8rem, 8vw, 4rem);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px #0008; touch-action: manipulation;
    }
    .btn:active { background: #666; transform: scale(0.92); }

    .dpad { width: 48%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .row { display: flex; gap: 12px; }
    .actions { width: 48%; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  </style>
</head>
<body>

<div id="start-screen">
  <h1>GridFlow</h1>
  <div style="margin:30px 0 60px; font-size:1.6rem; color:#777;">by ꜱᴀᴍᴍɪᴇ</div>
  <button id="play">START GAME</button>
</div>

<div id="difficulty" class="hidden">
  <h2 style="font-size: clamp(3rem, 14vw, 5.5rem); color:#0ff; margin-bottom:50px;">LEVEL</h2>
  <button id="easy">EASY</button>
  <button id="medium">MEDIUM</button>
  <button id="extreme">EXTREME</button>
</div>

<div id="game" class="hidden">
  <div id="play-area">
    <div id="pause-btn">P</div>
    <canvas id="canvas"></canvas>
    <div id="next-preview"><canvas id="next" width="90" height="90"></canvas></div>
  </div>

  <div id="controller">
    <div class="dpad">
      <div class="row"><button class="btn" id="up">↑</button></div>
      <div class="row">
        <button class="btn" id="left">←</button>
        <button class="btn" id="down">↓</button>
        <button class="btn" id="right">→</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="ccw">Z</button>
      <button class="btn" id="drop" style="width:160px; height:160px; font-size:60px;">▼</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const nextCtx = document.getElementById('next').getContext('2d');

let BLOCK = 0;
let board = Array(20).fill().map(() => Array(10).fill(0)); // 20 rows, 10 cols
let currentPiece = null;
let dropTimer = 0;
let lastTime = 0;
let paused = false;

const COLORS = [null, '#00ffff', '#ffff00', '#800080', '#00ff00', '#ff0000', '#0000ff', '#ffa500'];

const SHAPES = [
  null,
  [[1,1,1,1]],               // I
  [[1,1],[1,1]],             // O
  [[0,1,0],[1,1,1]],         // T
  [[0,1,1],[1,1,0]],         // S
  [[1,1,0],[0,1,1]],         // Z
  [[1,0,0],[1,1,1]],         // J
  [[0,0,1],[1,1,1]]          // L
];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  BLOCK = Math.max(36, Math.floor(w / 10));

  canvas.width = w * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx.scale(dpr, dpr);

  draw();
}

window.addEventListener('resize', resize);

function spawnPiece() {
  const type = Math.floor(Math.random() * 7) + 1;
  currentPiece = {
    type,
    shape: SHAPES[type].map(row => row.slice()),
    x: Math.floor(10 / 2) - 2,
    y: -SHAPES[type].length
  };
}

function collides() {
  if (!currentPiece) return false;
  const { shape, x, y } = currentPiece;
  for (let dy = 0; dy < shape.length; dy++) {
    for (let dx = 0; dx < shape[dy].length; dx++) {
      if (shape[dy][dx]) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx < 0 || nx >= 10 || ny >= 20) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
    }
  }
  return false;
}

function merge() {
  currentPiece.shape.forEach((row, dy) => {
    row.forEach((val, dx) => {
      if (val) {
        const ny = currentPiece.y + dy;
        if (ny >= 0) board[ny][currentPiece.x + dx] = currentPiece.type;
      }
    });
  });
}

function lockPiece() {
  merge();
  spawnPiece();
  // Simple line clear stub (expand later)
}

function update(time = 0) {
  if (paused) return requestAnimationFrame(update);

  const dt = time - lastTime;
  lastTime = time;

  dropTimer += dt;
  if (dropTimer > 800) {
    if (currentPiece) currentPiece.y++;
    if (collides()) {
      currentPiece.y--;
      lockPiece();
    }
    dropTimer = 0;
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#000011';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath(); ctx.moveTo(i*BLOCK,0); ctx.lineTo(i*BLOCK,canvas.height); ctx.stroke();
  }
  for (let i = 0; i <= 20; i++) {
    ctx.beginPath(); ctx.moveTo(0,i*BLOCK); ctx.lineTo(canvas.width,i*BLOCK); ctx.stroke();
  }

  // Placed blocks
  board.forEach((row, y) => {
    row.forEach((val, x) => {
      if (val) {
        ctx.fillStyle = COLORS[val];
        ctx.fillRect(x*BLOCK, y*BLOCK, BLOCK, BLOCK);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(x*BLOCK, y*BLOCK, BLOCK, BLOCK);
      }
    });
  });

  // Current piece
  if (currentPiece) {
    ctx.fillStyle = COLORS[currentPiece.type];
    currentPiece.shape.forEach((row, dy) => {
      row.forEach((val, dx) => {
        if (val) {
          const px = currentPiece.x + dx;
          const py = currentPiece.y + dy;
          if (py >= 0) ctx.fillRect(px*BLOCK, py*BLOCK, BLOCK, BLOCK);
        }
      });
    });
  }
}

resize();
spawnPiece();

// Start flow
document.getElementById('play').onclick = () => {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('difficulty').classList.remove('hidden');
};

function begin() {
  document.getElementById('difficulty').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  resize();
  draw();
  requestAnimationFrame(update);
}

document.getElementById('easy').onclick = begin;
document.getElementById('medium').onclick = begin;
document.getElementById('extreme').onclick = begin;

// Controller
const buttons = {
  left: document.getElementById('left'),
  right: document.getElementById('right'),
  down: document.getElementById('down'),
  up: document.getElementById('up'),
  ccw: document.getElementById('ccw'),
  drop: document.getElementById('drop')
};

Object.keys(buttons).forEach(key => {
  buttons[key].addEventListener('touchstart', e => {
    e.preventDefault();
    buttons[key].style.background = '#777';
    setTimeout(() => buttons[key].style.background = '#3a3a3a', 140);
    console.log(key + ' pressed');
    // Add real logic later (move left/right, soft drop, rotate, hard drop)
  });
});

document.getElementById('pause-btn').addEventListener('click', e => {
  e.preventDefault();
  paused = !paused;
  alert(paused ? "PAUSED" : "RESUMED");
});
</script>
</body>
</html>
