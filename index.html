<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GridFlow – by ꜱᴀᴍᴍɪᴇ</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111;
      --text: #ddd;
      --accent: #00eaff;
      --border: #333;
      --grid-bg: #000;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui, sans-serif;
      overflow:hidden;
      touch-action:none;
    }

    #menu, #difficulty-screen, #pause-screen, #game-over-screen {
      position:absolute; inset:0;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      background:rgba(0,0,0,0.88); z-index:10;
    }
    .hidden { display:none !important; }

    .title h1 { font-size: clamp(4.5rem, 16vw, 8rem); font-weight:900; background: linear-gradient(90deg, #00eaff, #ff00d4, #a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 50px rgba(0,230,255,0.7); }
    .creator { font-size:1.6rem; font-weight:bold; letter-spacing:8px; color:#555; text-transform:uppercase; margin:1.5rem 0 3.5rem; }

    .menu-btn {
      width:82%; max-width:380px;
      padding:1.4rem; margin:1rem 0;
      font-size:1.5rem; font-weight:600;
      background:#222; border:2px solid #666;
      color:#eee; border-radius:16px;
      cursor:pointer; transition:all 0.18s;
    }
    .menu-btn:active { background:#0099cc; border-color:#00eaff; transform:scale(0.96); }

    #game-container {
      height:100vh; display:flex; flex-direction:column;
    }

    #game-area {
      flex:1; /* upper ~half */
      position:relative;
      display:flex; justify-content:center; align-items:center;
      background:#000;
    }

    #game-board {
      width:52vw; height:80vh;
      background:var(--grid-bg);
      border:4px solid #444;
      box-shadow:0 0 70px rgba(0,0,0,0.98);
      image-rendering:pixelated;
    }

    #next-box {
      position:absolute; right:10px; top:10px;
      width:100px; height:100px;
      background:#0f0f1a; border:2px solid #555; border-radius:8px;
      display:flex; justify-content:center; align-items:center;
    }

    #hud {
      position:absolute; top:10px; left:70px; right:10px;
      display:flex; justify-content:space-between;
      font-size:1.3rem; color:#0ff; z-index:5;
    }

    #pause-btn {
      position:absolute; top:15px; left:15px;
      width:48px; height:48px;
      background:rgba(240,180,0,0.85);
      border:3px solid #ff0; border-radius:50%;
      color:white; font-size:1.8rem;
      display:flex; align-items:center; justify-content:center;
      z-index:9; cursor:pointer;
    }

    #controller-area {
      height:50vh; /* lower half - always visible in game */
      background:#0d0d0d;
      border-top:2px solid #333;
      display:flex; justify-content:space-between; align-items:center;
      padding:0 3rem;
      position:relative;
    }

    .ctrl-btn {
      width: clamp(80px, 18vw, 110px);
      height: clamp(80px, 18vw, 110px);
      background:rgba(90,90,90,0.8);
      border:4px solid #777;
      border-radius:50%;
      color:white; font-size: clamp(2.4rem, 7vw, 3.2rem);
      display:flex; align-items:center; justify-content:center;
      touch-action:manipulation;
      user-select:none;
    }

    .ctrl-btn:active { transform:scale(0.92); background:rgba(120,120,120,0.9); }

    .dpad-group { width:45%; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }

    .action-group { width:45%; display:flex; flex-direction:column; align-items:center; gap:20px; }

    /* ... pause-screen & game-over styles same as before ... */
  </style>
</head>
<body>

  <!-- Main Menu -->
  <div id="menu">
    <div class="title"><h1>GridFlow</h1></div>
    <div class="creator">ꜱᴀᴍᴍɪᴇ</div>
    <button class="menu-btn" id="start-game-btn">START GAME</button>
    <button class="menu-btn" id="levels-btn">LEVELS</button>
    <button class="menu-btn" id="settings-btn">SETTINGS</button>
    <button class="menu-btn" id="help-btn">HELP</button>
    <button class="menu-btn" id="credits-btn">CREDITS</button>
  </div>

  <!-- Difficulty selection after pressing START GAME -->
  <div id="difficulty-screen" class="hidden">
    <h2 style="font-size:4rem; color:#0ff; margin-bottom:2rem; text-shadow:0 0 20px #0ff;">SELECT DIFFICULTY</h2>
    <button class="menu-btn" id="easy-btn">EASY</button>
    <button class="menu-btn" id="medium-btn">MEDIUM</button>
    <button class="menu-btn" id="extreme-btn">EXTREME</button>
  </div>

  <!-- Game Screen -->
  <div id="game-container" class="hidden">
    <div id="game-area">
      <div id="hud">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
      </div>
      <div id="pause-btn">P</div>
      <canvas id="game-board"></canvas>
      <div id="next-box"><canvas id="next-canvas"></canvas></div>
    </div>

    <div id="controller-area">
      <!-- Left side D-pad -->
      <div class="dpad-group">
        <div class="ctrl-btn" id="left">←</div>
        <div class="ctrl-btn" id="right">→</div>
        <div class="ctrl-btn" id="down">↓</div>
        <div class="ctrl-btn" id="rotate-cw">↑</div>
      </div>

      <!-- Right side actions -->
      <div class="action-group">
        <div class="ctrl-btn" id="rotate-ccw">Z</div>
        <div class="ctrl-btn" id="hard-drop" style="width:120px; height:120px; font-size:3.5rem;">▼</div>
      </div>
    </div>
  </div>

  <!-- Pause & Game Over screens (minimal placeholders) -->
  <div id="pause-screen" class="hidden"><h1>PAUSED</h1><button class="menu-btn" id="resume">RESUME</button></div>
  <div id="game-over-screen" class="hidden"><h1 style="color:#f33;">GAME OVER</h1><p>Such a loser...</p></div>

  <!-- Audio -->
  <audio id="bg-music" loop preload="auto"></audio>
  <audio id="move-sfx" preload="auto">
    <source src="https://orangefreesounds.com/wp-content/uploads/2022/06/Tetris-block-move-sound-effect.mp3" type="audio/mpeg">
  </audio>
  <audio id="drop-sfx" preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d7b6e7f2a.mp3?filename=game-over-arcade-8-bit-38328.mp3" type="audio/mpeg">
  </audio>
  <audio id="line-sfx" preload="auto">
    <source src="https://assets.codepen.io/243235/clear-line.mp3" type="audio/mpeg">
  </audio>

  <script>
    const menu = document.getElementById('menu');
    const diffScreen = document.getElementById('difficulty-screen');
    const gameContainer = document.getElementById('game-container');
    const pauseBtn = document.getElementById('pause-btn');

    const music = document.getElementById('bg-music');
    const moveSfx = document.getElementById('move-sfx');
    const dropSfx = document.getElementById('drop-sfx');
    const lineSfx = document.getElementById('line-sfx');

    // Difficulty selection flow
    document.getElementById('start-game-btn').addEventListener('click', e => {
      e.preventDefault();
      menu.classList.add('hidden');
      diffScreen.classList.remove('hidden');
    });

    function startGame(diff) {
      diffScreen.classList.add('hidden');
      gameContainer.classList.remove('hidden');

      let interval = diff === 'easy' ? 1200 : diff === 'medium' ? 700 : 400;
      // dropInterval = interval;  // ← connect to your game logic

      // Play solemn piano AFTER user interaction
      music.src = "https://cdn.pixabay.com/download/audio/2024/01/10/audio_4f8d9e1c3b.mp3?filename=soft-piano-ambient-122456.mp3";
      music.volume = 0.22;
      music.play().catch(err => console.log("Music requires tap:", err));

      console.log(`Started GridFlow - ${diff.toUpperCase()} mode`);
      // Start your actual game loop, spawn piece, etc. here
    }

    document.getElementById('easy-btn').addEventListener('click', () => startGame('easy'));
    document.getElementById('medium-btn').addEventListener('click', () => startGame('medium'));
    document.getElementById('extreme-btn').addEventListener('click', () => startGame('extreme'));

    // Controller buttons (only these control the game - no board touch)
    document.getElementById('left').addEventListener('touchstart', e => { e.preventDefault(); /* move left */ moveSfx.currentTime=0; moveSfx.play().catch(()=>{}); });
    document.getElementById('right').addEventListener('touchstart', e => { e.preventDefault(); /* move right */ moveSfx.currentTime=0; moveSfx.play().catch(()=>{}); });
    document.getElementById('down').addEventListener('touchstart', e => { e.preventDefault(); /* soft drop */ });
    document.getElementById('rotate-cw').addEventListener('touchstart', e => { e.preventDefault(); /* rotate cw */ moveSfx.currentTime=0; moveSfx.play().catch(()=>{}); });
    document.getElementById('rotate-ccw').addEventListener('touchstart', e => { e.preventDefault(); /* rotate ccw */ moveSfx.currentTime=0; moveSfx.play().catch(()=>{}); });
    document.getElementById('hard-drop').addEventListener('touchstart', e => { e.preventDefault(); /* hard drop */ dropSfx.currentTime=0; dropSfx.play().catch(()=>{}); });

    pauseBtn.addEventListener('click', e => {
      e.preventDefault();
      // pause logic...
      document.getElementById('pause-screen').classList.remove('hidden');
    });

    document.getElementById('resume').addEventListener('click', () => {
      document.getElementById('pause-screen').classList.add('hidden');
    });
  </script>
</body>
  </html>
