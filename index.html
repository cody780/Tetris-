<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GridFlow – by ꜱᴀᴍᴍɪᴇ</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111;
      --text: #ddd;
      --accent: #00eaff;
      --border: #333;
      --grid-bg: #000;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body { height:100vh; background:var(--bg); color:var(--text); font-family:system-ui, sans-serif; overflow:hidden; touch-action:none; }

    #menu, #levels-screen, #pause-screen, #game-over-screen { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(0,0,0,0.88); z-index:10; }

    .hidden { display:none !important; }

    .title h1 { font-size: clamp(4rem, 14vw, 7rem); font-weight:900; background: linear-gradient(90deg, #00eaff, #ff00d4, #a855f7); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 40px rgba(0,230,255,0.6); }

    .creator { font-size:1.5rem; font-weight:bold; letter-spacing:7px; color:#555; text-transform:uppercase; margin:1.2rem 0 3rem; }

    .menu-btn { width:80%; max-width:360px; padding:1.3rem; margin:0.8rem 0; font-size:1.45rem; font-weight:600; background:#222; border:2px solid #555; color:#eee; border-radius:14px; cursor:pointer; transition:all 0.2s; }

    .menu-btn:active, .menu-btn:focus { background:#0099cc; border-color:#00eaff; transform:scale(0.98); }

    #pause-btn { position:absolute; top:10px; left:10px; width:45px; height:45px; background:rgba(240,180,0,0.8); border:3px solid #ff0; border-radius:50%; color:white; font-size:1.8rem; display:flex; align-items:center; justify-content:center; z-index:9; cursor:pointer; }

    #game-board { width:52vw; height:78vh; background:var(--grid-bg); border:3px solid #333; box-shadow:0 0 60px rgba(0,0,0,0.95); image-rendering:pixelated; }

    /* ... keep other styles like controls, hud, next-box from your last working version ... */

    #controls { /* your left/right/up/down + hard drop layout */ }
  </style>
</head>
<body>

  <div id="menu">
    <div class="title"><h1>GridFlow</h1></div>
    <div class="creator">ꜱᴀᴍᴍɪᴇ</div>
    <button class="menu-btn" onclick="handleMenuClick(startGame)">START GAME</button>
    <button class="menu-btn" onclick="handleMenuClick(showLevels)">LEVELS</button>
    <button class="menu-btn" onclick="handleMenuClick(showSettings)">SETTINGS</button>
    <button class="menu-btn" onclick="handleMenuClick(showHelp)">HELP</button>
    <button class="menu-btn" onclick="handleMenuClick(showCredits)">CREDITS</button>
  </div>

  <div id="levels-screen" class="hidden">
    <h2 style="color:#0ff; font-size:3rem;">LEVEL</h2>
    <button class="menu-btn" onclick="handleMenuClick(()=>startGame('easy'))">EASY</button>
    <button class="menu-btn" onclick="handleMenuClick(()=>startGame('hard'))">HARD</button>
    <button class="menu-btn" onclick="handleMenuClick(()=>startGame('extreme'))">EXTREME</button>
    <button class="menu-btn" onclick="handleMenuClick(hideLevels)">BACK</button>
  </div>

  <div id="pause-btn" onclick="pauseGame()">P</div>

  <!-- game-container, board, controls, pause-screen, game-over-screen ... keep as is -->

  <audio id="bg-music" loop preload="auto"></audio>
  <audio id="move-sfx" preload="auto"><source src="https://orangefreesounds.com/wp-content/uploads/2022/06/Tetris-block-move-sound-effect.mp3" type="audio/mpeg"></audio>
  <audio id="drop-sfx" preload="auto"><source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_0d7b6e7f2a.mp3?filename=game-over-arcade-8-bit-38328.mp3" type="audio/mpeg"></audio>
  <audio id="line-sfx" preload="auto"><source src="https://assets.codepen.io/243235/clear-line.mp3" type="audio/mpeg"></audio>

  <script>
    function handleMenuClick(fn) {
      event.preventDefault();
      event.stopPropagation();
      fn();
    }

    function hideLevels() {
      document.getElementById('levels-screen').classList.add('hidden');
    }

    function showLevels() {
      document.getElementById('levels-screen').classList.remove('hidden');
    }

    // ... rest of your script (init, startGame, move, rotate, etc.) ...

    // In startGame():
    // music.src = "https://cdn.pixabay.com/download/audio/2024/01/10/audio_4f8d9e1c3b.mp3?filename=soft-piano-ambient-122456.mp3";
    // music.volume = 0.22;
    // music.play().catch(() => console.log("Music started after gesture"));

    // Add to move/rotate/hardDrop/line clear as above
  </script>
</body>
</html>
