<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GridFlow – by ꜱᴀᴍᴍɪᴇ</title>
  <style>
    body { margin:0; height:100vh; background:#000; overflow:hidden; touch-action:none; font-family:sans-serif; color:#eee; }
    #menu, #difficulty, #pause-overlay, #game-over { position:fixed; inset:0; background:#000d; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; visibility:hidden; opacity:0; transition:opacity 0.3s; }
    #menu.visible, #difficulty.visible, #pause-overlay.visible, #game-over.visible { visibility:visible; opacity:1; }
    .hidden { display:none !important; }
    h1 { font-size: clamp(5rem, 20vw, 10rem); background:linear-gradient(90deg,#0ff,#f0f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 40px #0ff8; }
    button { width:80%; max-width:340px; padding:20px; margin:12px 0; font-size:22px; background:#222; border:3px solid #555; color:#eee; border-radius:10px; cursor:pointer; }
    button:active { background:#006; transform:scale(0.96); }
    #start-feedback { font-size:1.4rem; margin-top:40px; color:#0f0; text-align:center; }
    #game { height:100vh; display:flex; flex-direction:column; }
    #play-area { flex:1; position:relative; background:#000; display:flex; justify-content:center; align-items:center; pointer-events:none; }
    #canvas { width:62vw; max-width:380px; height:calc(62vw * 2.1); max-height:65vh; background:#000; border:3px solid #444; border-bottom:14px solid #555; image-rendering:pixelated; }
    #next-preview { position:absolute; right:12px; top:12px; width:90px; height:90px; background:#0a0a1a; border:2px solid #444; border-radius:6px; overflow:hidden; }
    #pause-btn { position:absolute; top:12px; left:12px; width:50px; height:50px; background:rgba(255,180,0,0.85); border:3px solid #ff0; border-radius:50%; color:white; font-size:1.9rem; display:flex; align-items:center; justify-content:center; z-index:10; }
    #controller { height:100vh; background:#0a0a0a; border-top:4px solid #333; display:flex; justify-content:center; align-items:center; }
    .dpad { 
      display:grid; 
      grid-template-columns:1fr 1fr 1fr; 
      grid-template-rows:1fr 1fr 1fr; 
      gap:9px;
      width:clamp(340px,75vw,440px); 
      height:clamp(340px,75vw,440px); 
      place-items:center; 
    }
    .btn { width:clamp(110px,24vw,150px); height:clamp(110px,24vw,150px); background:#3a3a3a; border:6px solid #888; border-radius:50%; color:white; font-size:clamp(3rem,9vw,4.5rem); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px #0008; touch-action:manipulation; }
    .btn:active { background:#666; transform:scale(0.92); }
    #hud { position:absolute; top:12px; left:80px; right:12px; display:flex; justify-content:space-between; font-size:1.4rem; color:#0ff; text-shadow:0 0 12px #0ff8; z-index:5; }
    #score-board { animation:scoreflash 1.8s infinite alternate; }
    @keyframes scoreflash { from { opacity:0.75; text-shadow:0 0 12px #0ff8; } to { opacity:1; text-shadow:0 0 24px #0ff; } }
    #game-over h2 { color:#ff4444; text-shadow:0 0 30px #f00; }
  </style>
</head>
<body>

<div id="menu" class="visible">
  <h1>GridFlow</h1>
  <div style="margin:30px 0 60px; font-size:1.6rem; color:#777;">by ꜱᴀᴍᴍɪᴇ</div>
  <button id="start-game-btn">START GAME</button>
  <button id="settings-btn">SETTINGS</button>
  <button id="help-btn">HELP</button>
  <button id="credits-btn">CREDITS</button>
  <div id="start-feedback"></div>
</div>

<div id="difficulty">
  <h2 style="font-size:clamp(3rem,14vw,5.5rem); color:#0ff; margin-bottom:50px;">LEVEL</h2>
  <button id="easy-btn">EASY</button>
  <button id="medium-btn">MEDIUM</button>
  <button id="extreme-btn">EXTREME</button>
</div>

<div id="game" class="hidden">
  <div id="play-area">
    <div id="hud">
      <div>Score: <span id="score">0</span></div>
      <div id="score-board">Level: <span id="level">1</span></div>
    </div>
    <div id="pause-btn">P</div>
    <canvas id="canvas"></canvas>
    <div id="next-preview"><canvas id="next-canvas" width="90" height="90"></canvas></div>
  </div>

  <div id="controller">
    <div class="dpad">
      <div></div><button class="btn" id="rotate-cw">↑</button><div></div>
      <button class="btn" id="move-left">←</button><div></div><button class="btn" id="move-right">→</button>
      <div></div><button class="btn" id="soft-drop">↓</button><div></div>
    </div>
  </div>
</div>

<div id="pause-overlay" class="hidden">
  <h2>PAUSED</h2>
  <button id="resume-btn">RESUME</button>
</div>

<div id="game-over" class="hidden">
  <div style="font-size:clamp(8rem,40vw,12rem);">🧸</div>
  <h2 style="margin:20px 0;">Such a loser...</h2>
  <div style="font-size:2rem; color:#ff0;">Final Score: <span id="final-score">0</span></div>
  <button id="restart-btn" style="margin-top:40px;">TRY AGAIN</button>
</div>

<!-- Audio -->
<audio id="bg-music" loop preload="auto"></audio>
<audio id="move-sfx" preload="auto"><source src="https://assets.codepen.io/243235/move-click.mp3" type="audio/mpeg"></audio>
<audio id="rotate-sfx" preload="auto"><source src="https://assets.codepen.io/243235/rotate-click.mp3" type="audio/mpeg"></audio>
<audio id="drop-sfx" preload="auto"><source src="https://assets.codepen.io/243235/drop.mp3" type="audio/mpeg"></audio>
<audio id="line-sfx" preload="auto"><source src="https://assets.codepen.io/243235/clear-line.mp3" type="audio/mpeg"></audio>

<script>
// ────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const nextCtx = document.getElementById('next-canvas').getContext('2d');

const bgMusic = document.getElementById('bg-music');
const moveSfx = document.getElementById('move-sfx');
const rotateSfx = document.getElementById('rotate-sfx');
const dropSfx = document.getElementById('drop-sfx');
const lineSfx = document.getElementById('line-sfx');

let BLOCK = 0;
let board = Array(20).fill().map(() => Array(10).fill(0));
let currentPiece = null;
let nextPieceType = 0;
let dropTimer = 0;
let lastTime = 0;
let paused = false;
let softDrop = false;
let score = 0;
let level = 1;
let gameOver = false;

const COLORS = [null, '#00ffff', '#ffff00', '#800080', '#00ff00', '#ff0000', '#0000ff', '#ffa500'];

const SHAPES = [
  null,
  [[1,1,1,1]],                // I
  [[1,1],[1,1]],              // O
  [[0,1,0],[1,1,1]],          // T
  [[0,1,1],[1,1,0]],          // S
  [[1,1,0],[0,1,1]],          // Z
  [[1,0,0],[1,1,1]],          // J
  [[0,0,1],[1,1,1]]           // L
];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.min(window.innerWidth * 0.9, window.innerHeight * 0.55);
  BLOCK = Math.floor(w / 10);

  canvas.width = 10 * BLOCK * dpr;
  canvas.height = 20 * BLOCK * dpr;
  ctx.scale(dpr, dpr);
  draw();
}

window.addEventListener('resize', resize);

function spawnPiece() {
  const type = nextPieceType || Math.floor(Math.random()*7) + 1;
  nextPieceType = Math.floor(Math.random()*7) + 1;

  currentPiece = {
    type: type,
    shape: SHAPES[type].map(r => r.slice()),
    x: 3,
    y: -2
  };
  dropTimer = 0;

  if (collides()) gameOverFunc();
}

function collides() {
  if (!currentPiece) return false;
  const s = currentPiece.shape;
  for (let dy = 0; dy < s.length; dy++) {
    for (let dx = 0; dx < s[dy].length; dx++) {
      if (s[dy][dx]) {
        const nx = currentPiece.x + dx;
        const ny = currentPiece.y + dy;
        if (nx < 0 || nx >= 10 || ny >= 20) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
    }
  }
  return false;
}

function merge() {
  currentPiece.shape.forEach((row, dy) => {
    row.forEach((val, dx) => {
      if (val && currentPiece.y + dy >= 0) {
        board[currentPiece.y + dy][currentPiece.x + dx] = currentPiece.type;
      }
    });
  });
}

function clearLines() {
  let lines = 0;
  for (let y = 19; y >= 0; y--) {
    if (board[y].every(val => val !== 0)) {
      board.splice(y, 1);
      board.unshift(Array(10).fill(0));
      lines++;
      y++;
    }
  }
  if (lines > 0) {
    const base = [0, 40, 100, 300, 1200][lines];
    score += base * (level + 1);
    document.getElementById('score').textContent = score;
    lineSfx.currentTime = 0;
    lineSfx.play().catch(() => {});
    level = Math.floor(score / 10000) + 1;
    document.getElementById('level').textContent = level;
  }
}

function lockPiece() {
  merge();
  clearLines();
  spawnPiece();
  dropSfx.currentTime = 0;
  dropSfx.play().catch(() => {});
}

function gameOverFunc() {
  gameOver = true;
  paused = true;
  document.getElementById('game-over').classList.remove('hidden');
  document.getElementById('final-score').textContent = score;
  bgMusic.pause();
}

function move(dx) {
  currentPiece.x += dx;
  if (collides()) currentPiece.x -= dx;
  else {
    moveSfx.currentTime = 0;
    moveSfx.play().catch(() => {});
  }
}

function rotate(cw = true) {
  const oldShape = currentPiece.shape.map(r => r.slice());
  const w = oldShape[0].length;
  const h = oldShape.length;

  let newShape;
  if (cw) {
    newShape = Array(w).fill().map(() => Array(h).fill(0));
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        newShape[x][h - 1 - y] = oldShape[y][x];
      }
    }
  } else {
    newShape = Array(w).fill().map(() => Array(h).fill(0));
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        newShape[w - 1 - x][y] = oldShape[y][x];
      }
    }
  }

  currentPiece.shape = newShape;

  if (collides()) {
    currentPiece.x += 1;
    if (collides()) {
      currentPiece.x -= 2;
      if (collides()) {
        currentPiece.x += 1;
        currentPiece.shape = oldShape;
        return;
      }
    }
  }
  rotateSfx.currentTime = 0;
  rotateSfx.play().catch(() => {});
}

function update(time = 0) {
  if (paused || gameOver) return requestAnimationFrame(update);

  const dt = time - lastTime;
  lastTime = time;

  const frameSpeed = Math.max(1, 800 - (level - 1) * 60);
  const speed = softDrop ? 40 : frameSpeed;
  dropTimer += dt;

  if (dropTimer > speed) {
    currentPiece.y++;
    if (collides()) {
      currentPiece.y--;
      lockPiece();
    }
    dropTimer = 0;
  }

  draw();
  requestAnimationFrame(update);
}

function draw() {
  ctx.fillStyle = '#000011';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // grid
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath(); ctx.moveTo(i*BLOCK,0); ctx.lineTo(i*BLOCK,canvas.height/BLOCK|0); ctx.stroke();
  }
  for (let i = 0; i <= 20; i++) {
    ctx.beginPath(); ctx.moveTo(0,i*BLOCK); ctx.lineTo(canvas.width/BLOCK|0,i*BLOCK); ctx.stroke();
  }

  // board
  board.forEach((row, y) => {
    row.forEach((val, x) => {
      if (val) {
        const px = x * BLOCK;
        const py = y * BLOCK;
        ctx.fillStyle = COLORS[val];
        ctx.fillRect(px, py, BLOCK, BLOCK);
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(px, py, BLOCK, BLOCK/2);
        ctx.strokeStyle = '#111';
        ctx.strokeRect(px, py, BLOCK, BLOCK);
      }
    });
  });

  // current piece
  if (currentPiece) {
    ctx.fillStyle = COLORS[currentPiece.type];
    currentPiece.shape.forEach((row, dy) => {
      row.forEach((val, dx) => {
        if (val) {
          const px = (currentPiece.x + dx) * BLOCK;
          const py = (currentPiece.y + dy) * BLOCK;
          if (currentPiece.y + dy >= 0) {
            ctx.fillRect(px, py, BLOCK, BLOCK);
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.fillRect(px, py, BLOCK, BLOCK/2);
            ctx.strokeStyle = '#111';
            ctx.strokeRect(px, py, BLOCK, BLOCK);
          }
        }
      });
    });
  }

  // next piece preview
  nextCtx.fillStyle = '#001122';
  nextCtx.fillRect(0,0,90,90);
  if (nextPieceType) {
    const shape = SHAPES[nextPieceType];
    const col = COLORS[nextPieceType];
    nextCtx.fillStyle = col;
    const offX = shape[0].length === 4 ? 5 : 15;
    const offY = shape.length === 1 ? 35 : 15;
    shape.forEach((row, dy) => {
      row.forEach((val, dx) => {
        if (val) nextCtx.fillRect(offX + dx*18, offY + dy*18, 16, 16);
      });
    });
  }
}

resize();
spawnPiece();

// ─── Event listeners ─────────────────────────────────────

document.getElementById('start-game-btn').addEventListener('touchstart', e => {
  e.preventDefault();
  document.getElementById('start-feedback').textContent = 'START pressed → loading difficulty...';
  document.getElementById('start-feedback').style.color = '#0f0';
  document.getElementById('menu').classList.remove('visible');
  document.getElementById('menu').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('difficulty').classList.add('visible');
    document.getElementById('difficulty').classList.remove('hidden');
  }, 200);
});

document.getElementById('start-game-btn').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('start-feedback').textContent = 'START pressed (click) → loading...';
  document.getElementById('start-feedback').style.color = '#ff0';
  document.getElementById('menu').classList.remove('visible');
  document.getElementById('menu').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('difficulty').classList.add('visible');
    document.getElementById('difficulty').classList.remove('hidden');
  }, 200);
});

function begin() {
  document.getElementById('difficulty').classList.remove('visible');
  document.getElementById('difficulty').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  resize();
  spawnPiece();
  draw();
  requestAnimationFrame(update);
  // bgMusic.play().catch(() => {}); // uncomment when you add a real src
}

document.getElementById('easy-btn').addEventListener('touchstart', e => { e.preventDefault(); begin(); });
document.getElementById('medium-btn').addEventListener('touchstart', e => { e.preventDefault(); begin(); });
document.getElementById('extreme-btn').addEventListener('touchstart', e => { e.preventDefault(); begin(); });

// Controls
document.getElementById('move-left').addEventListener('touchstart', e => { e.preventDefault(); if (!paused && currentPiece) move(-1); });
document.getElementById('move-right').addEventListener('touchstart', e => { e.preventDefault(); if (!paused && currentPiece) move(1); });

document.getElementById('soft-drop').addEventListener('touchstart', e => {
  e.preventDefault();
  softDrop = true;
});
document.getElementById('soft-drop').addEventListener('touchend', e => {
  e.preventDefault();
  softDrop = false;
});

document.getElementById('rotate-cw').addEventListener('touchstart', e => { 
  e.preventDefault(); 
  if (!paused && currentPiece) rotate(true); 
});
document.getElementById('rotate-cw').addEventListener('dblclick', e => {
  e.preventDefault();
  if (!paused && currentPiece) rotate(false);
});

document.getElementById('pause-btn').addEventListener('touchstart', e => {
  e.preventDefault();
  paused = !paused;
  document.getElementById('pause-overlay').classList.toggle('hidden', !paused);
  if (paused) bgMusic.pause(); else bgMusic.play().catch(() => {});
});

document.getElementById('resume-btn').addEventListener('touchstart', e => {
  e.preventDefault();
  paused = false;
  document.getElementById('pause-overlay').classList.add('hidden');
  bgMusic.play().catch(() => {});
});

document.getElementById('restart-btn').addEventListener('touchstart', e => {
  e.preventDefault();
  board = Array(20).fill().map(() => Array(10).fill(0));
  score = 0;
  level = 1;
  gameOver = false;
  paused = false;
  document.getElementById('game-over').classList.add('hidden');
  document.getElementById('score').textContent = 0;
  document.getElementById('level').textContent = 1;
  spawnPiece();
  draw();
});
</script>
</body>
  </html>
