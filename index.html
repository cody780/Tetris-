<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GridFlow</title>
  <style>
    body {
      margin:0; height:100vh; background:#000; overflow:hidden; touch-action:none; font-family:sans-serif; color:#eee;
    }

    #start-screen, #difficulty {
      position:fixed; inset:0; z-index:100;
      background:#000d; display:flex; flex-direction:column; justify-content:center; align-items:center;
    }
    .hidden { display:none !important; }

    h1 { font-size: clamp(5rem, 20vw, 10rem); background:linear-gradient(90deg,#0ff,#f0f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    button {
      width:80%; max-width:340px; padding:20px; margin:12px 0;
      font-size:22px; background:#222; border:3px solid #555; color:#eee; border-radius:10px;
    }
    button:active { background:#006; transform:scale(0.96); }

    #game {
      height:100vh; display:flex; flex-direction:column;
    }

    #play-area {
      flex: 5.7;          /* ≈57% upper part */
      position: relative;
      background:#000;
      display: flex; justify-content:center; align-items:center;
      pointer-events: none;
    }

    #canvas {
      width: 62vw;
      max-width: 380px;
      height: 94%;
      max-height: 640px;
      background:#000;
      border: 3px solid #333;
      image-rendering: pixelated;
    }

    #next-preview {
      position: absolute;
      right: 12px;
      top: 12px;
      width: 90px;
      height: 90px;
      background: #0a0a1a;
      border: 2px solid #444;
      border-radius: 6px;
    }

    #pause-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 50px;
      height: 50px;
      background: rgba(255,180,0,0.85);
      border: 3px solid #ff0;
      border-radius: 50%;
      color: white;
      font-size: 1.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #controller {
      flex: 4.3;          /* ≈43% lower part */
      background: #0a0a0a;
      border-top: 4px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px 15px;
    }

    .btn {
      width: clamp(100px, 22vw, 140px);
      height: clamp(100px, 22vw, 140px);
      background: #3a3a3a;
      border: 5px solid #777;
      border-radius: 50%;
      color: white;
      font-size: clamp(2.8rem, 8vw, 4rem);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px #0008;
      touch-action: manipulation;
    }
    .btn:active { background: #666; transform: scale(0.92); }

    .dpad { width: 48%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .row { display: flex; gap: 12px; }
    .actions { width: 48%; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  </style>
</head>
<body>

<div id="start-screen">
  <h1>GridFlow</h1>
  <div style="margin:30px 0 60px; font-size:1.6rem; color:#777;">by ꜱᴀᴍᴍɪᴇ</div>
  <button id="play">START GAME</button>
</div>

<div id="difficulty" class="hidden">
  <h2 style="font-size: clamp(3rem, 14vw, 5.5rem); color:#0ff; margin-bottom:50px;">LEVEL</h2>
  <button id="easy">EASY</button>
  <button id="medium">MEDIUM</button>
  <button id="extreme">EXTREME</button>
</div>

<div id="game" class="hidden">
  <div id="play-area">
    <div id="pause-btn">P</div>
    <canvas id="canvas"></canvas>
    <div id="next-preview"><canvas id="next" width="90" height="90"></canvas></div>
  </div>

  <div id="controller">
    <div class="dpad">
      <div class="row"><button class="btn" id="up">↑</button></div>
      <div class="row">
        <button class="btn" id="left">←</button>
        <button class="btn" id="down">↓</button>
        <button class="btn" id="right">→</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="ccw">Z</button>
      <button class="btn" id="drop" style="width:160px; height:160px; font-size:60px;">▼</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const nextCtx = document.getElementById('next').getContext('2d');

let BLOCK = 0;
let piece = null;
let dropTimer = 0;
let last = 0;

// Very basic I piece for testing
const COLORS = [null, '#00ffff'];
const SHAPE = [[1,1,1,1]];

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth;
  BLOCK = Math.max(36, Math.floor(w / 10));

  canvas.width = w * dpr;
  canvas.height = canvas.clientHeight * dpr;
  ctx.scale(dpr, dpr);

  draw();
}

window.addEventListener('resize', resize);

function spawnPiece() {
  piece = {
    x: 3,
    y: -1,
    shape: SHAPE,
    color: 1
  };
}

function draw() {
  ctx.fillStyle = '#000011';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // grid
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    ctx.beginPath(); ctx.moveTo(i*BLOCK,0); ctx.lineTo(i*BLOCK,canvas.height); ctx.stroke();
  }
  for (let i = 0; i <= 20; i++) {
    ctx.beginPath(); ctx.moveTo(0,i*BLOCK); ctx.lineTo(canvas.width,i*BLOCK); ctx.stroke();
  }

  // current piece
  if (piece) {
    ctx.fillStyle = COLORS[piece.color];
    ctx.fillRect(piece.x*BLOCK, Math.max(0, piece.y*BLOCK), 4*BLOCK, BLOCK);

    ctx.strokeStyle = '#009999';
    ctx.lineWidth = 3;
    ctx.strokeRect(piece.x*BLOCK, Math.max(0, piece.y*BLOCK), 4*BLOCK, BLOCK);
  }

  // next (static O for now)
  nextCtx.fillStyle = '#001122';
  nextCtx.fillRect(0,0,90,90);
  nextCtx.fillStyle = '#ffff00';
  nextCtx.fillRect(15,15,60,60);
}

function loop(ts) {
  if (!last) last = ts;
  const dt = ts - last;
  last = ts;

  dropTimer += dt;
  if (dropTimer > 800) {
    if (piece) piece.y++;
    if (piece && piece.y > 18) {
      piece.y = 0; // loop for testing
    }
    dropTimer = 0;
  }

  draw();
  requestAnimationFrame(loop);
}

// ────────────────────────────────────────────────
document.getElementById('play').onclick = () => {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('difficulty').classList.remove('hidden');
};

function begin() {
  document.getElementById('difficulty').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  resize();
  spawnPiece();
  requestAnimationFrame(loop);
}

document.getElementById('easy').onclick = begin;
document.getElementById('medium').onclick = begin;
document.getElementById('extreme').onclick = begin;

// Controller press feedback
document.querySelectorAll('.btn').forEach(b => {
  b.addEventListener('touchstart', e => {
    e.preventDefault();
    b.style.background = '#777';
    setTimeout(() => b.style.background = '#444', 140);
    console.log(b.id + ' pressed');
  });
});

document.getElementById('pause-btn').onclick = () => alert("Paused (coming soon)");
</script>
</body>
  </html>
