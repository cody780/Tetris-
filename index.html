<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TETRIS • ꜱᴀᴍᴍɪᴇ</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #111;
      --text: #e0f0ff;
      --text-dim: #88aacc;
      --accent: #00eaff;
      --accent-dark: #0099cc;
      --border: #222;
      --grid: #1a2533;
      --block-border: #004466;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 3rem;
      padding: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    #menu, #game {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 15px 50px rgba(0,0,0,0.8),
                  inset 0 0 25px rgba(0,230,255,0.06);
      width: 380px;
      text-align: center;
    }

    h1 {
      font-size: 4.8rem;
      font-weight: 900;
      letter-spacing: -5px;
      background: linear-gradient(90deg, #00eaff, #ff00d4, #00eaff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: glow 5s ease-in-out infinite alternate;
      margin-bottom: 2rem;
    }

    @keyframes glow { 0%,100% { opacity:0.92; } 50% { opacity:1; } }

    .menu-btn {
      display: block;
      width: 100%;
      padding: 1.2rem;
      margin: 1.1rem 0;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text);
      background: transparent;
      border: 2px solid var(--accent-dark);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu-btn:hover {
      background: var(--accent-dark);
      border-color: var(--accent);
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,230,255,0.3);
    }

    .creator {
      margin-top: 3rem;
      font-size: 1.15rem;
      color: var(--text-dim);
    }
    .creator strong {
      color: var(--accent);
      font-weight: 800;
      letter-spacing: 1.5px;
      text-shadow: 0 0 12px rgba(0,230,255,0.6);
    }

    /* ── GAME ── */
    #game { display: none; width: 480px; }
    .game-area {
      display: flex;
      gap: 2.5rem;
      justify-content: center;
    }
    canvas {
      background: var(--grid);
      border: 2px solid var(--border);
      image-rendering: pixelated;
      box-shadow: 0 0 30px rgba(0,230,255,0.15);
    }
    #preview {
      border: 2px solid var(--border);
      background: #0f1622;
    }
    .stats {
      margin-top: 1.5rem;
      font-size: 1.3rem;
      color: var(--text-dim);
    }
    .stats span { color: var(--accent); font-weight: bold; }

    #pause-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 25px currentColor;
      z-index: 10;
    }

    @media (max-width: 850px) {
      #container { flex-direction: column; align-items: center; }
      #game { width: 90%; max-width: 420px; }
    }
  </style>
</head>
<body>

<div id="container">

  <!-- MENU -->
  <div id="menu">
    <h1>TETRIS</h1>
    <button class="menu-btn" id="btn-start">START GAME</button>
    <button class="menu-btn" id="btn-levels">LEVELS</button>
    <button class="menu-btn" id="btn-settings">SETTINGS</button>
    <button class="menu-btn" id="btn-credits">CREDITS</button>

    <div class="creator">
      MADE WITH ♡ BY <strong>ꜱᴀᴍᴍɪᴇ</strong>
    </div>
  </div>

  <!-- GAME -->
  <div id="game">
    <div class="game-area">
      <canvas id="board" width="300" height="600"></canvas>
      <div>
        <h2 style="margin-bottom:1rem; color:var(--accent);">NEXT</h2>
        <canvas id="preview" width="120" height="120"></canvas>

        <div class="stats">
          <div>Score: <span id="score">0</span></div>
          <div>Level: <span id="level">1</span></div>
          <div>Lines: <span id="lines">0</span></div>
        </div>
      </div>
    </div>

    <div id="pause-overlay">PAUSED</div>
  </div>

</div>

<script>
// ────────────────────────────────────────────────
//  MAIN MENU
// ────────────────────────────────────────────────
document.getElementById('btn-start').onclick = () => {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  initGame();
};

document.getElementById('btn-levels').onclick   = () => alert("Levels coming soon...");
document.getElementById('btn-settings').onclick = () => alert("Settings: sound / ghost / controls...");
document.getElementById('btn-credits').onclick  = () => alert("TETRIS • Dark Edition\nCreated by ꜱᴀᴍᴍɪᴇ • 2025");

// ────────────────────────────────────────────────
//  TETRIS GAME LOGIC
// ────────────────────────────────────────────────
const canvas = document.getElementById('board');
const ctx    = canvas.getContext('2d');
const nextCanvas = document.getElementById('preview');
const nextCtx    = nextCanvas.getContext('2d');

const COLS = 10;
const ROWS = 20;
const BLOCK = 30;

let board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
let score = 0, lines = 0, level = 1;
let dropCounter = 0, dropInterval = 1000;
let lastTime = 0;
let gameRunning = false;
let paused = false;

const colors = [
  null,
  '#00FFFF', // I cyan
  '#FFFF00', // O yellow
  '#800080', // T purple
  '#00FF00', // S green
  '#FF0000', // Z red
  '#0000FF', // J blue
  '#FFA500'  // L orange
];

const tetrominoes = [
  null,
  [[1,1,1,1]],           // I
  [[1,1],[1,1]],         // O
  [[0,1,0],[1,1,1]],     // T
  [[0,1,1],[1,1,0]],     // S
  [[1,1,0],[0,1,1]],     // Z
  [[1,0,0],[1,1,1]],     // J
  [[0,0,1],[1,1,1]]      // L
];

let player = {
  pos: {x:0, y:0},
  matrix: null,
  next: null
};

function createPiece() {
  const type = Math.floor(Math.random() * 7) + 1;
  return tetrominoes[type].map(row => row.slice());
}

function playerReset() {
  player.matrix = player.next || createPiece();
  player.next = createPiece();
  player.pos.y = 0;
  player.pos.x = Math.floor(COLS / 2 - player.matrix[0].length / 2);

  if (collide()) {
    gameOver();
    return false;
  }
  drawNext();
  return true;
}

function collide() {
  const [m, o] = [player.matrix, player.pos];
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 &&
         (board[y + o.y] &&
          board[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function merge() {
  player.matrix.forEach((row, y) => {
    row.forEach((val, x) => {
      if (val !== 0) {
        board[y + player.pos.y][x + player.pos.x] = val;
      }
    });
  });
}

function playerDrop() {
  player.pos.y++;
  if (collide()) {
    player.pos.y--;
    merge();
    playerReset();
    sweepLines();
  }
  dropCounter = 0;
}

function playerMove(dir) {
  player.pos.x += dir;
  if (collide()) player.pos.x -= dir;
}

function playerRotate(dir) {
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide()) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; ++y) {
    for (let x = 0; x < y; ++x) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function sweepLines() {
  let rowCount = 1;
  outer: for (let y = ROWS - 1; y > 0; --y) {
    for (let x = 0; x < COLS; ++x) {
      if (board[y][x] === 0) continue outer;
    }
    board.splice(y, 1);
    board.unshift(Array(COLS).fill(0));
    ++y;
    lines += rowCount;
    score += rowCount * 100 * level;
    rowCount *= 2;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(100, 1000 - (level-1)*80);
  }
  updateUI();
}

function updateUI() {
  document.getElementById('score').textContent = score;
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}

function drawBlock(ctx, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x*BLOCK, y*BLOCK, BLOCK, BLOCK);
  ctx.strokeStyle = var(--block-border);
  ctx.lineWidth = 2;
  ctx.strokeRect(x*BLOCK+1, y*BLOCK+1, BLOCK-2, BLOCK-2);
}

function drawMatrix(matrix, offset, context = ctx) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        drawBlock(context, x + offset.x, y + offset.y, colors[value]);
      }
    });
  });
}

function drawBoard() {
  board.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        drawBlock(ctx, x, y, colors[value]);
      }
    });
  });
}

function drawNext() {
  nextCtx.fillStyle = '#0f1622';
  nextCtx.fillRect(0,0,nextCanvas.width,nextCanvas.height);
  const nextOffset = {
    x: Math.floor(4 - player.next[0].length / 2),
    y: Math.floor(4 - player.next.length / 2)
  };
  drawMatrix(player.next, nextOffset, nextCtx);
}

function draw() {
  ctx.fillStyle = var(--grid);
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawBoard();
  drawMatrix(player.matrix, player.pos);
}

function update(time = 0) {
  if (!gameRunning || paused) return requestAnimationFrame(update);

  const delta = time - lastTime;
  lastTime = time;

  dropCounter += delta;
  if (dropCounter > dropInterval) {
    playerDrop();
  }

  draw();
  requestAnimationFrame(update);
}

function gameOver() {
  gameRunning = false;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#ff3366';
  ctx.font = 'bold 48px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
  ctx.font = '24px Arial';
  ctx.fillStyle = '#00eaff';
  ctx.fillText('Press START to play again', canvas.width/2, canvas.height/2 + 40);
}

function initGame() {
  board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  score = lines = 0; level = 1;
  dropInterval = 1000;
  updateUI();

  playerReset();
  gameRunning = true;
  paused = false;
  lastTime = 0;
  dropCounter = 0;
  update();
}

// Controls
document.addEventListener('keydown', e => {
  if (!gameRunning) return;

  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    document.getElementById('pause-overlay').style.display = paused ? 'flex' : 'none';
    if (!paused) update();
  }

  if (paused) return;

  if (e.key === 'ArrowLeft')  playerMove(-1);
  if (e.key === 'ArrowRight') playerMove(1);
  if (e.key === 'ArrowDown')  playerDrop();
  if (e.key === ' ' || e.key === 'ArrowUp') {
    e.preventDefault();
    playerRotate(1);
  }
});

// Restart on game over (simple: click START again)
document.getElementById('btn-start').addEventListener('click', () => {
  if (!gameRunning) {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    initGame();
  }
});

</script>
</body>
</html>
