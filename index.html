<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>GridFlow – by ꜱᴀᴍᴍɪᴇ</title>
  <style>
    body { margin:0; height:100vh; background:#000; overflow:hidden; touch-action:none; font-family:sans-serif; color:#eee; }
    #menu, #difficulty, #pause-overlay, #game-over { position:fixed; inset:0; background:#000d; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:100; visibility:hidden; opacity:0; transition:opacity 0.3s; }
    #menu.visible, #difficulty.visible, #pause-overlay.visible, #game-over.visible { visibility:visible; opacity:1; }
    .hidden { display:none !important; }
    h1 { font-size: clamp(5rem, 20vw, 10rem); background:linear-gradient(90deg,#0ff,#f0f); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-shadow:0 0 40px #0ff8; }
    button { width:80%; max-width:340px; padding:20px; margin:12px 0; font-size:22px; background:#222; border:3px solid #555; color:#eee; border-radius:10px; cursor:pointer; }
    button:active { background:#006; transform:scale(0.96); }
    #start-feedback { font-size:1.4rem; margin-top:40px; color:#0f0; text-align:center; }
    #game { height:100vh; display:flex; flex-direction:column; }
    #play-area { 
      flex: 0 1 auto; 
      max-height: 68vh; 
      position:relative; 
      background:#000; 
      display:flex; 
      justify-content:center; 
      align-items:center; 
      padding: 4px 0; 
    }
    #canvas { 
      width: 94vw; 
      max-width: 480px; 
      height: calc(94vw * 1.78); 
      max-height: 66vh; 
      background:#000; 
      border:3px solid #444; 
      border-bottom:14px solid #555; 
      image-rendering:pixelated; 
    }
    #next-preview { position:absolute; right:3vw; top:3vw; width:70px; height:70px; background:#0a0a1a; border:2px solid #444; border-radius:6px; overflow:hidden; z-index:5; }
    #pause-btn { position:absolute; top:3vw; left:3vw; width:48px; height:48px; background:rgba(255,180,0,0.85); border:3px solid #ff0; border-radius:50%; color:white; font-size:1.8rem; display:flex; align-items:center; justify-content:center; z-index:10; }
    #controller { 
      flex: 0 0 26vh;           /* fixed smaller height – should force visibility */
      background:#0a0a0a; 
      border-top:4px solid #333; 
      display:flex; 
      justify-content:center; 
      align-items:center; 
      padding: 6px; 
      box-sizing: border-box;
    }
    .controls { 
      display: flex; 
      width: 94vw; 
      max-width: 440px; 
      justify-content: space-between; 
      align-items: center; 
    }
    .side-btn { 
      width: clamp(110px, 32vw, 160px); 
      height: clamp(110px, 32vw, 160px); 
      background:#3a3a3a; 
      border:5px solid #888; 
      border-radius:50%; 
      color:white; 
      font-size:clamp(3.5rem,10vw,5rem); 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      box-shadow:0 6px 18px #0008; 
    }
    .side-btn:active { background:#666; transform:scale(0.95); }
    .center-buttons { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 12px; 
    }
    .center-btn { 
      width: clamp(90px, 26vw, 130px); 
      height: clamp(90px, 26vw, 130px); 
      background:#3a3a3a; 
      border:5px solid #888; 
      border-radius:50%; 
      color:white; 
      font-size:clamp(2.8rem,8vw,4rem); 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      box-shadow:0 6px 18px #0008; 
    }
    .center-btn:active { background:#666; transform:scale(0.95); }
    #hud { position:absolute; top:3vw; left:60px; right:3vw; display:flex; justify-content:space-between; font-size:1.3rem; color:#0ff; text-shadow:0 0 10px #0ff8; z-index:5; pointer-events:none; }
    #score-board { animation:scoreflash 1.8s infinite alternate; }
    @keyframes scoreflash { from { opacity:0.75; text-shadow:0 0 10px #0ff8; } to { opacity:1; text-shadow:0 0 20px #0ff; } }
    #game-over h2 { color:#ff4444; text-shadow:0 0 30px #f00; }
  </style>
</head>
<body>

<!-- menus unchanged -->

<div id="game" class="hidden">
  <div id="play-area">
    <div id="hud">
      <div>Score: <span id="score">0</span></div>
      <div id="score-board">Level: <span id="level">1</span></div>
    </div>
    <div id="pause-btn">P</div>
    <canvas id="canvas"></canvas>
    <div id="next-preview"><canvas id="next-canvas" width="70" height="70"></canvas></div>
  </div>

  <div id="controller">
    <div class="controls">
      <button class="side-btn" id="move-left">←</button>
      
      <div class="center-buttons">
        <button class="center-btn" id="rotate-cw">↑</button>
        <button class="center-btn" id="soft-drop">↓</button>
      </div>
      
      <button class="side-btn" id="move-right">→</button>
    </div>
  </div>
</div>

<!-- pause & game-over unchanged -->

<script>
// ... (all the script code stays exactly the same as your last working version)
// only the event listeners for controls change slightly:

// Controls – updated IDs and layout
document.getElementById('move-left').addEventListener('touchstart', e => {
  e.preventDefault();
  if (!paused && currentPiece) startMove(-1);
});
document.getElementById('move-left').addEventListener('touchend', e => {
  e.preventDefault();
  stopMove();
});

document.getElementById('move-right').addEventListener('touchstart', e => {
  e.preventDefault();
  if (!paused && currentPiece) startMove(1);
});
document.getElementById('move-right').addEventListener('touchend', e => {
  e.preventDefault();
  stopMove();
});

document.getElementById('soft-drop').addEventListener('touchstart', e => {
  e.preventDefault();
  softDrop = true;
});
document.getElementById('soft-drop').addEventListener('touchend', e => {
  e.preventDefault();
  softDrop = false;
});

document.getElementById('rotate-cw').addEventListener('touchstart', e => { 
  e.preventDefault(); 
  if (!paused && currentPiece) rotate(true); 
});
document.getElementById('rotate-cw').addEventListener('dblclick', e => {
  e.preventDefault();
  if (!paused && currentPiece) rotate(false);
});

// pause, resume, restart unchanged
</script>
</body>
</html>
